ref: activedirectory.group_create
label: "Create Group"
description: "Create Group using only modeled structured parameters"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: activedirectory_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: activedirectory.credentials, required: true, description: "Pack-owned Attune Key reference"}
  expected_host: {type: string, required: true, description: "Must exactly match the credential profile host"}
  path_dn: {type: string, description: "Allowed destination container or OU distinguished name", required: true}
  name: {type: string, required: true}
  sam_account_name: {type: string, required: true}
  description: {type: string}
  group_scope: {type: string, enum: [DomainLocal, Global, Universal], required: true}
  group_category: {type: string, enum: [Distribution, Security], required: true}
  timeout_seconds: {type: integer, minimum: 5, maximum: 900, default: 120}
output:
  operation: {type: string}
  target_host: {type: string}
  target_domain: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [active-directory, group, write]
