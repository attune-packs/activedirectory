ref: activedirectory.user_expiration_set
label: "Set User Expiration"
description: "Set User Expiration using only modeled structured parameters"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: activedirectory_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: activedirectory.credentials, required: true, description: "Pack-owned Attune Key reference"}
  expected_host: {type: string, required: true, description: "Must exactly match the credential profile host"}
  object_id: {type: string, description: "Stable object GUID or distinguished name", required: true}
  expiration_utc: {type: string, description: "UTC timestamp in YYYY-MM-DDTHH:MM:SSZ form"}
  clear_expiration: {type: boolean}
  timeout_seconds: {type: integer, minimum: 5, maximum: 900, default: 120}
output:
  operation: {type: string}
  target_host: {type: string}
  target_domain: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [active-directory, user, write]
