ref: activedirectory.group_member_add
label: "Add Group Member"
description: "Add one stable principal identity as a direct group member with exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: activedirectory_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: activedirectory.credentials, required: true, description: "Pack-owned Attune Key reference"}
  expected_host: {type: string, required: true, description: "Must exactly match the credential profile host"}
  group_id: {type: string, description: "Stable group GUID or distinguished name", required: true}
  member_id: {type: string, description: "Stable principal GUID or distinguished name", required: true}
  confirmation: {type: string, description: "Exact operation-specific confirmation value", required: true}
  timeout_seconds: {type: integer, minimum: 5, maximum: 900, default: 120}
output:
  operation: {type: string}
  target_host: {type: string}
  target_domain: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [active-directory, group, write]
