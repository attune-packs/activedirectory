ref: activedirectory
label: "Microsoft Active Directory"
description: "Curated Active Directory administration through reviewed PowerShell over verified WinRM HTTPS"
version: "0.1.0"
author: "Attune; adapted from work by Encore Technologies and StackStorm Exchange contributors"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: identity
  documentation_url: "https://learn.microsoft.com/en-us/powershell/module/activedirectory/?view=windowsserver2025-ps"
  repository_url: "https://github.com/attune-packs/activedirectory"
  source_repository: "https://github.com/StackStorm-Exchange/stackstorm-activedirectory"
  source_revision: "2bdf09685f3d80e514eb5b586b344d41b35f063c"
  source_version: "1.0.1"
  license: "Apache-2.0"

tags: [active-directory, microsoft, windows-server, identity, winrm]
runtime_deps: [python, powershell-remoting]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
